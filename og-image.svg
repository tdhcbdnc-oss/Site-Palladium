<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- Холст квадратный, потому что qlmanage не сохраняет пропорции.
       Дизайн лежит в полосе y=285..915 (ровно 630), её и вырезаем через sips. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a1e"/>
      <stop offset="55%" stop-color="#081434"/>
      <stop offset="100%" stop-color="#04081a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaf7ff"/>
      <stop offset="30%" stop-color="#7cc3f0"/>
      <stop offset="62%" stop-color="#3a72cc" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#2f5fbf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a8ada" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#4a8ada" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fd4f0" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#7fd4f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050a1e" stop-opacity=".92"/>
      <stop offset="70%" stop-color="#050a1e" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#050a1e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- орбитальная система, как в шапке сайта -->
  <g transform="translate(880,600)">
    <circle r="300" fill="url(#halo)"/>
    <g fill="none" stroke="#9dc4e2" stroke-opacity=".42" stroke-width="1.6">
      <ellipse rx="268" ry="100" transform="rotate(-18)"/>
      <ellipse rx="212" ry="158" transform="rotate(30)"/>
      <ellipse rx="290" ry="54" transform="rotate(9)"/>
    </g>
    <circle r="78" fill="url(#glow)"/>
    <circle r="30" fill="#eaf7ff" opacity=".92"/>
    <g fill="#d6ecff">
      <circle cx="252" cy="-82" r="8"/>
      <circle cx="-188" cy="139" r="6.5" opacity=".85"/>
      <circle cx="100" cy="-152" r="5.5" opacity=".9"/>
      <circle cx="-272" cy="-38" r="5" opacity=".7"/>
      <circle cx="170" cy="125" r="4.5" opacity=".7"/>
    </g>
  </g>

  <!-- затемнение слева, чтобы текст читался поверх орбит -->
  <rect x="0" y="285" width="900" height="630" fill="url(#veil)"/>

  <!-- логотип -->
  <text x="72" y="378" font-family="Helvetica Neue, Helvetica, Arial" font-size="38" font-weight="600"
        letter-spacing="13" fill="#f7f9ff">PALLADIUM</text>
  <rect x="72" y="398" width="320" height="2" fill="url(#rule)"/>
  <text x="72" y="436" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="500"
        letter-spacing="5" fill="#7fd4f0">AI-ИНТЕГРАТОР · ПРОДУКТЫ И УСЛУГИ</text>

  <!-- основной тезис -->
  <text font-family="Helvetica Neue, Helvetica, Arial" font-size="52" font-weight="700" fill="#f7f9ff">
    <tspan x="72" y="558">Технологический</tspan>
    <tspan x="72" y="620">департамент, которого</tspan>
    <tspan x="72" y="682">у вашей компании</tspan>
    <tspan x="72" y="744" fill="#7fd4f0">никогда не было</tspan>
  </text>

  <!-- нижняя строка -->
  <rect x="72" y="806" width="1056" height="1" fill="#9dc4e2" opacity=".26"/>
  <text x="72" y="852" font-family="Helvetica Neue, Helvetica, Arial" font-size="21" font-weight="600"
        letter-spacing="2.5" fill="#e9eeff">palladium.com.ru</text>
  <text x="470" y="852" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="500"
        letter-spacing="3.2" fill="#9dc4e2">РАЗБОР 30 МИНУТ — БЕСПЛАТНО</text>
</svg>
